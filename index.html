<script>(function(){var errEl=document.getElementById('err');function showErr(msg){try{errEl.textContent=msg;errEl.hidden=false}catch(e){}}window.addEventListener('error',function(e){showErr('Something went wrong: '+(e&&e.message?e.message:'unknown error'))});function $(id){return document.getElementById(id)}var minEl=$('min'),secEl=$('sec'),digits=$('digits'),stateEl=$('state');var bar=$('bar'),go=$('go'),app=$('app'),clock=$('clock'),voiceOn=$('voiceOn'),voiceMsg=$('voiceMsg');var C=2*Math.PI*90;var total=300,endAt=0,remainingMs=300000,running=false,timer=null;var lastSecond=null,wakeLock=null,voice=null,audioCtx=null,synth=null;function on(el,fn){if(el)el.addEventListener('click',function(e){try{fn(e)}catch(err){showErr('Something went wrong: '+err.message)}})}on(go,function(){if(running)pause();else start()});on($('reset'),reset);on($('test'),function(){speakNow('4 minutes 30 seconds')});on($('minDown'),function(){bump(minEl,-1,99,false)});on($('minUp'),function(){bump(minEl,1,99,false)});on($('secDown'),function(){bump(secEl,-5,59,true)});on($('secUp'),function(){bump(secEl,5,59,true)});var presetBtns=document.querySelectorAll('[data-preset]');for(var i=0;i<presetBtns.length;i++){(function(b){on(b,function(){if(!running)setTotal(parseInt(b.getAttribute('data-preset'),10))})})(presetBtns[i])}minEl.addEventListener('change',function(){if(!running){readInputs();stateEl.textContent='Ready'}});secEl.addEventListener('change',function(){if(!running){readInputs();stateEl.textContent='Ready'}});function getSynth(){if(synth!==null)return synth;try{synth=(window.speechSynthesis&&typeof window.SpeechSynthesisUtterance==='function')?window.speechSynthesis:false}catch(e){synth=false}if(!synth){voiceMsg.textContent="Voice isn't available in this browser. The timer and the end beep still work.";voiceMsg.hidden=false}return synth}function pickVoice(){var s=getSynth();if(!s)return;try{var vs=s.getVoices()||[],j;for(j=0;j<vs.length;j++)if(/en[-_]AU/i.test(vs[j].lang)){voice=vs[j
